<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración de Nombrado</title>
  <style>
    body { background-color: #121212; color: #FFFFFF; font-family: Arial, sans-serif; text-align: center; margin: 20px; }
    .input-container { display: flex; flex-direction: column; gap: 15px; width: 90%; max-width: 800px; margin: 0 auto; }
    .options { text-align: left; margin: 20px 0; }
    .option { margin: 10px 0; }
    select, input { padding: 10px; font-size: 16px; border-radius: 4px; border: 1px solid #555; background-color: #2c2c2c; color: #fff; width: 100%; }
    button { padding: 12px 20px; font-size: 16px; background-color: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #555; }
    #preview { margin-top: 20px; color: #90ee90; }
  </style>
</head>
<body>
  <h1>Configuración de Nombrado</h1>
  <nav>
    <a href="/profesor/config-prompt">Configurar Prompt</a> |
    <a href="/profesor/config-naming">Configurar Nombrado</a> |
    <a href="/auth/logout">Cerrar Sesión</a>
  </nav>
  <div class="input-container">
    <h2>Criterios de Nombrado</h2>
    <p>Selecciona los criterios que los alumnos deberán proporcionar.</p>
    <div class="options">
      <div class="option"><input type="checkbox" name="fields" value="nombre"> Nombre</div>
      <div class="option"><input type="checkbox" name="fields" value="grupo"> Grupo</div>
      <div class="option"><input type="checkbox" name="fields" value="numeroLista"> Número de Lista</div>
      <div class="option"><input type="checkbox" name="fields" value="asignatura"> Asignatura</div>
    </div>
    <button onclick="saveCriteria()">Guardar Criterios</button>
  </div>

  <script>
    function saveCriteria() {
      const selectedFields = Array.from(document.querySelectorAll('input[name="fields"]:checked')).map(cb => cb.value);
      
      fetch('/profesor/save-naming-criteria', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: selectedFields })
      })
      .then(response => response.json())
      .then(data => alert(data.message || 'Error'))
      .catch(error => console.error('Error:', error));
    }
  </script>
</body>
</html>
