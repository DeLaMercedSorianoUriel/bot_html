<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurar Prompt - Chatbot</title>
  <style>
    body { background-color: #121212; color: #FFFFFF; font-family: Arial, sans-serif; text-align: center; }
    .input-container { display: flex; gap: 15px; width: 90%; max-width: 800px; margin: 62px auto; }
    #prompt-input { flex: 1; padding: 12px; font-size: 16px; border-radius: 4px; border: 1px solid #555; background-color: #2c2c2c; color: #fff; }
    button { padding: 12px 20px; font-size: 16px; background-color: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #555; }
    #status-message { margin-top: 20px; color: #90ee90; }
    .error { color: #ff4d4d; }
  </style>
</head>
<body>
  <h1>Configurar Prompt Inicial</h1>
  <nav>
    <a href="/profesor/config-prompt">Configurar Prompt</a> |
    <a href="/profesor/config-naming">Configurar Nombrado</a> |
    <a href="/auth/logout">Cerrar Sesión</a>
  </nav>
  <div class="input-container">
    <input type="text" id="prompt-input" placeholder="Ingresa el nuevo prompt inicial...">
    <button onclick="updatePrompt()">Actualizar</button>
  </div>
  <div id="status-message"></div>

  <script>
    async function updatePrompt() {
      const promptInput = document.getElementById('prompt-input');
      const statusMessage = document.getElementById('status-message');
      const prompt = promptInput.value.trim();

      if (!prompt) {
        statusMessage.textContent = 'El prompt no puede estar vacío.';
        statusMessage.classList.add('error');
        return;
      }

      try {
        const response = await fetch('/profesor/update-prompt', { // La ruta ahora es segura
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }) // El backend ya espera 'prompt'
        });

        const data = await response.json();
        if (response.ok) {
          statusMessage.textContent = data.message;
          statusMessage.classList.remove('error');
          promptInput.value = '';
        } else {
          statusMessage.textContent = data.error || 'Error al actualizar el prompt.';
          statusMessage.classList.add('error');
        }
      } catch (error) {
        console.error('Error:', error);
        statusMessage.textContent = 'Error de conexión.';
        statusMessage.classList.add('error');
      }
    }
  </script>
</body>
</html>
